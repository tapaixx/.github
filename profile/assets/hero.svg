<path d="M0 360H150L182 328H388L424 292H523 M952 394H1120L1152 362H1440 M1130 96H1224L1261 133H1440" stroke="#5FD7FC" stroke-width="2" opacity=".22" fill="none"/>
<circle cx="1270" cy="212" r="156" stroke="#6B9EFF" stroke-width="1" stroke-dasharray="7 17" opacity=".23" fill="none"/>
<circle cx="1270" cy="212" r="122" stroke="#8C65FB" stroke-width="1" opacity=".21" fill="none"/>
<path d="M1270 42V382M1100 212H1440" stroke="#74E8FF" opacity=".08"/>
