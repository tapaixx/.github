<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
<title id="title">tapaixx — Engineering the next interface</title>
<desc id="desc">Futuristic TAP monogram and tapaixx wordmark in neon cyan, electric blue, and violet on a dark technical grid.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050916"/><stop offset=".55" stop-color="#0B1530"/><stop offset="1" stop-color="#17102F"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2A3B5C"/><stop offset=".24" stop-color="#131D38"/><stop offset=".76" stop-color="#080F23"/><stop offset="1" stop-color="#1E2546"/></linearGradient>
 <linearGradient id="neon" x1="0" y1=".2" x2="1" y2=".85"><stop stop-color="#43F4FF"/><stop offset=".42" stop-color="#138DFF"/><stop offset=".8" stop-color="#A962FF"/><stop offset="1" stop-color="#EA46FF"/></linearGradient>
 <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60FFFF"/><stop offset=".48" stop-color="#268FFF"/><stop offset="1" stop-color="#C64FFF"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#5168FF" stop-opacity=".18"/><stop offset="1" stop-color="#5168FF" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#47749F" stroke-width=".7" stroke-opacity=".20"/></pattern>
 <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
 <clipPath id="rounded"><rect width="1440" height="440" rx="22"/></clipPath>
</defs>
<g clip-path="url(#rounded)">
<rect width="1440" height="440" fill="url(#bg)"/>
<rect width="1440" height="440" fill="url(#grid)"/>
<ellipse cx="390" cy="220" rx="440" ry="340" fill="url(#glow)"/>
