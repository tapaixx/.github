<text x="615" y="237" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="142" letter-spacing="-8" fill="url(#neon)" stroke="#A4D8FF" stroke-width=".7" paint-order="stroke">tapaixx</text>
<text x="623" y="284" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#D5EFFF">ENGINEERING THE NEXT INTERFACE</text>
<path d="M624 304H1230" stroke="url(#neon)" stroke-opacity=".65" stroke-width="2"/>
